[workspace]
members = [
    "controller", 
    "netconf",
    "simulator",
    "ssh",
]
resolver = "3"

[workspace.package]
authors = ["Hoang Anh Pham"]
categories = [""]
description = "SDN Framework"
documentation = ""
edition = "2024"
exclude = [""]
homepage = ""
include = [""]
keywords = [""]
license = "MIT"
publish = false
readme = ""
repository = ""
rust-version = "1.94"
version = "0.1.0"






[workspace.dependencies]
anyhow = "1"
bytes = "1"
russh = "0.62"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"]}
tokio = { version = "1", features = ["full"]}
argon2 = { version = "0.5", features = ["std"]}
rand_core = "0.10"
rpassword = "7"
